<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add PFX to MetaMask</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 20px;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
    }

    button {
      margin-top: 25px;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      src="https://raw.githubusercontent.com/kassahunyegetaneh-gif/assets/master/blockchains/ethereum/assets/0xB8F48a2B584C0fb27c920C46e0d1E168D70eeeDE/logo.png"
      alt="PFX Logo"
    >

    <h1>Phila Forex Trading</h1>

    <h2>PFX</h2>

    <p>Ethereum Sepolia Testnet</p>

    <button id="add">🦊 Add PFX to MetaMask</button>

    <p id="status"></p>

  </div>

  <script>
    const tokenAddress =
      "0xB8F48a2B584C0fb27c920C46e0d1E168D70eeeDE";

    const tokenSymbol = "PFX";
    const tokenDecimals = 18;

    const tokenImage =
      "https://raw.githubusercontent.com/kassahunyegetaneh-gif/assets/master/blockchains/ethereum/assets/0xB8F48a2B584C0fb27c920C46e0d1E168D70eeeDE/logo.png";

    async function addToken() {

      if (!window.ethereum) {
        document.getElementById("status").textContent =
          "Please install MetaMask.";
        return;
      }

      try {

        const chainId = await window.ethereum.request({
          method: "eth_chainId"
        });

        if (chainId !== "0xaa36a7") {
          document.getElementById("status").textContent =
            "Please switch MetaMask to Ethereum Sepolia first.";
          return;
        }

        const wasAdded = await window.ethereum.request({
          method: "wallet_watchAsset",
          params: {
            type: "ERC20",
            options: {
              address: tokenAddress,
              symbol: tokenSymbol,
              decimals: tokenDecimals,
              image: tokenImage
            }
          }
        });

        document.getElementById("status").textContent =
          wasAdded
            ? "PFX was added to MetaMask!"
            : "PFX was not added.";

      } catch (error) {

        document.getElementById("status").textContent =
          error.message || "Something went wrong.";

      }
    }

    document.getElementById("add").addEventListener("click", addToken);
  </script>

</body>
</html>
