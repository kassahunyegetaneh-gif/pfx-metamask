<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add PFX to MetaMask</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 20px;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
    }

    button {
      margin-top: 25px;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      src="https://raw.githubusercontent.com/kassahunyegetaneh-gif/assets/master/blockchains/ethereum/assets/0xB8F48a2B584C0fb27c920C46e0d1E168D70eeeDE/logo.png"
      alt="PFX Logo"
    >

    <h1>Phila Forex Trading</h1>
    <h2>PFX</h2>
    <p>Ethereum Sepolia Testnet</p>

    <button id="add">🦊 Add PFX to MetaMask</button>

    <p id="status"></p>

  </div>

  <script>

    const tokenAddress =
      "0xB8F48a2B584C0fb27c920C46e0d1E168D70eeeDE";

    const tokenSymbol = "PFX";
    const tokenDecimals = 18;

    const tokenImage =
      "https://raw.githubusercontent.com/kassahunyegetaneh-gif/assets/master/blockchains/ethereum/assets/0xB8F48a2B584C0fb27c920C46e0d1E168D70eeeDE/logo.png";

    const sepoliaChainId = "0xaa36a7";

    function getMetaMaskProvider() {

      if (!window.ethereum) {
        return null;
      }

      // If multiple wallets are installed,
      // choose MetaMask's provider.
      if (window.ethereum.providers) {

        const metamask = window.ethereum.providers.find(
          provider => provider.isMetaMask
        );

        if (metamask) {
          return metamask;
        }
      }

      // Single injected provider
      if (window.ethereum.isMetaMask) {
        return window.ethereum;
      }

      return null;
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function addToken() {

      const provider = getMetaMaskProvider();

      if (!provider) {
        setStatus(
          "MetaMask was not detected. Please open this page in Chrome with MetaMask installed."
        );
        return;
      }

      try {

        setStatus("Connecting to MetaMask...");

        await provider.request({
          method: "eth_requestAccounts"
        });

        let chainId = await provider.request({
          method: "eth_chainId"
        });

        if (chainId.toLowerCase() !== sepoliaChainId) {

          setStatus("Switching MetaMask to Sepolia...");

          await provider.request({
            method: "wallet_switchEthereumChain",
            params: [
              { chainId: sepoliaChainId }
            ]
          });
        }

        setStatus("Opening MetaMask...");

        const wasAdded = await provider.request({
          method: "wallet_watchAsset",
          params: {
            type: "ERC20",
            options: {
              address: tokenAddress,
              symbol: tokenSymbol,
              decimals: tokenDecimals,
              image: tokenImage
            }
          }
        });

        if (wasAdded) {
          setStatus("✅ PFX was added to MetaMask!");
        } else {
          setStatus("PFX was not added.");
        }

      } catch (error) {

        setStatus(
          error.message || "Something went wrong."
        );

      }
    }

    document
      .getElementById("add")
      .addEventListener("click", addToken);

  </script>

</body>
</html>
